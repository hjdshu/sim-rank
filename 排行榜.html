<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛车圈速排行榜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #000000 0%, #1a0000 100%);
            color: #fff;
            min-height: 100vh;
            padding: 0;
        }

        .container {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            margin: 0 auto;
            transition: max-width 0.3s ease;
        }

        .container.custom-width {
            max-width: var(--custom-width, 1200px);
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: var(--theme-bg, rgba(20, 0, 0, 0.8));
            border-radius: 10px;
            border: 1px solid var(--theme-border, rgba(255, 0, 0, 0.3));
            flex-shrink: 0;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--theme-primary, #ff0000), var(--theme-secondary, #cc0000));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px var(--theme-glow, rgba(255, 0, 0, 0.5));
        }
        
        .track-selector {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .track-selector label {
            color: #ddd;
            font-weight: bold;
        }

        .track-select {
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid var(--theme-border, rgba(255, 0, 0, 0.3));
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            min-width: 200px;
        }

        .track-select:focus {
            outline: none;
            border-color: var(--theme-primary, #ff0000);
            box-shadow: 0 0 10px var(--theme-glow, rgba(255, 0, 0, 0.3));
        }

        .width-settings {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--theme-border-light, rgba(255, 0, 0, 0.2));
        }

        .width-settings label {
            color: #ddd;
            font-size: 0.9rem;
        }

        .width-mode {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .width-mode input[type="radio"] {
            width: auto;
            cursor: pointer;
        }

        .width-input-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .width-input-group input[type="number"] {
            width: 100px;
            padding: 5px 10px;
        }

        .width-input-group span {
            color: #aaa;
        }
        
        .leaderboard {
            background: var(--theme-bg, rgba(10, 0, 0, 0.9));
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px var(--theme-glow, rgba(255, 0, 0, 0.2));
            border: 1px solid var(--theme-border, rgba(255, 0, 0, 0.3));
            margin-bottom: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .leaderboard-title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .leaderboard-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ddd;
        }

        .leaderboard-tabs {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }

        .leaderboard-tab {
            padding: 6px 14px;
            background: none;
            border: 1px solid var(--theme-border-light, rgba(255, 0, 0, 0.1));
            border-radius: 20px;
            color: #999;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }

        .leaderboard-tab:hover {
            color: #ddd;
            border-color: var(--theme-border, rgba(255, 0, 0, 0.3));
        }

        .leaderboard-tab.active {
            color: white;
            background: var(--theme-btn-bg, rgba(255, 0, 0, 0.2));
            border-color: var(--theme-primary, #ff0000);
            text-shadow: 0 0 8px var(--theme-glow, rgba(255, 0, 0, 0.5));
        }

        .leaderboard-header {
            display: grid;
            grid-template-columns: 0.5fr 1fr 1fr 1fr 1fr;
            padding: 15px 20px;
            background: var(--theme-header-bg, rgba(255, 0, 0, 0.2));
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            color: var(--theme-primary, #ff0000);
            flex-shrink: 0;
            border: 1px solid var(--theme-border, rgba(255, 0, 0, 0.3));
        }

        .leaderboard-list {
            flex: 1;
            overflow-y: auto;
        }

        .leaderboard-item {
            display: grid;
            grid-template-columns: 0.5fr 1fr 1fr 1fr 1fr;
            padding: 15px 20px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            transition: all 0.3s ease;
            border: 1px solid var(--theme-border-light, rgba(255, 0, 0, 0.1));
            border-left: 4px solid transparent;
        }

        .leaderboard-item:hover {
            background: var(--theme-hover-bg, rgba(255, 0, 0, 0.1));
            transform: translateY(-2px);
            border-color: var(--theme-border, rgba(255, 0, 0, 0.3));
            box-shadow: 0 5px 15px var(--theme-glow, rgba(255, 0, 0, 0.2));
        }
        
        .rank-1 {
            border-left-color: var(--theme-primary, #ff0000);
            background: var(--theme-rank1-bg, rgba(255, 0, 0, 0.2));
            box-shadow: 0 0 20px var(--theme-glow, rgba(255, 0, 0, 0.3));
        }

        .rank-2 {
            border-left-color: var(--theme-rank2-color, #cc0000);
            background: var(--theme-rank2-bg, rgba(204, 0, 0, 0.15));
        }

        .rank-3 {
            border-left-color: var(--theme-rank3-color, #990000);
            background: var(--theme-rank3-bg, rgba(153, 0, 0, 0.1));
        }
        
        .rank {
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
        }
        
        .driver-name {
            display: flex;
            align-items: center;
            font-weight: 500;
        }
        
        .lap-time {
            display: flex;
            align-items: center;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.1rem;
            color: #07ff0e;
        }
        
        .car-model {
            display: flex;
            align-items: center;
            color: #aaa;
            font-size: 0.9rem;
        }
        
        .btn-edit, .btn-delete {
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-edit {
            background: var(--theme-btn-bg, rgba(255, 0, 0, 0.2));
            color: var(--theme-btn-color, #ff6666);
            border: 1px solid var(--theme-border, rgba(255, 0, 0, 0.3));
        }

        .btn-edit:hover {
            background: var(--theme-btn-hover, rgba(255, 0, 0, 0.4));
            box-shadow: 0 0 10px var(--theme-glow, rgba(255, 0, 0, 0.3));
        }

        .btn-delete {
            background: var(--theme-rank3-bg, rgba(139, 0, 0, 0.3));
            color: var(--theme-primary, #ff0000);
            border: 1px solid var(--theme-border, rgba(255, 0, 0, 0.3));
        }

        .btn-delete:hover {
            background: var(--theme-btn-bg, rgba(139, 0, 0, 0.5));
            box-shadow: 0 0 10px var(--theme-glow, rgba(255, 0, 0, 0.3));
        }
        
        /* 管理区域样式 */
        .management-toggle {
            text-align: center;
            margin: 10px 0;
            flex-shrink: 0;
        }
        
        .toggle-btn {
            padding: 10px 20px;
            background: var(--theme-btn-bg, rgba(255, 0, 0, 0.2));
            color: white;
            border: 1px solid var(--theme-border, rgba(255, 0, 0, 0.3));
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .toggle-btn:hover {
            background: var(--theme-btn-hover, rgba(255, 0, 0, 0.4));
            box-shadow: 0 0 15px var(--theme-glow, rgba(255, 0, 0, 0.3));
        }
        
        .management-panel {
            background: var(--theme-bg, rgba(10, 0, 0, 0.9));
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px var(--theme-glow, rgba(255, 0, 0, 0.2));
            border: 1px solid var(--theme-border, rgba(255, 0, 0, 0.3));
            margin-bottom: 10px;
            display: none;
            max-height: 50vh;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .management-panel.active {
            display: block;
        }

        .panel-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--theme-border-light, rgba(255, 0, 0, 0.2));
        }

        .panel-tab {
            padding: 10px 20px;
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }

        .panel-tab.active {
            color: var(--theme-primary, #ff0000);
            border-bottom-color: var(--theme-primary, #ff0000);
            text-shadow: 0 0 10px var(--theme-glow, rgba(255, 0, 0, 0.5));
        }
        
        .panel-content {
            display: none;
        }
        
        .panel-content.active {
            display: block;
        }
        
        .edit-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--theme-hover-bg, rgba(0, 0, 0, 0.2));
            border-radius: 8px;
        }
        
        @media (max-width: 768px) {
            .edit-form {
                grid-template-columns: 1fr;
            }
        }
        
        .time-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #ddd;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--theme-border, rgba(255, 0, 0, 0.3));
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--theme-primary, #ff0000);
            box-shadow: 0 0 10px var(--theme-glow, rgba(255, 0, 0, 0.3));
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-add {
            background: linear-gradient(90deg, var(--theme-primary, #ff0000), var(--theme-secondary, #cc0000));
            color: white;
            border: 1px solid var(--theme-glow, rgba(255, 0, 0, 0.5));
        }

        .btn-add:hover {
            background: linear-gradient(90deg, var(--theme-secondary, #cc0000), var(--theme-rank3-color, #990000));
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--theme-glow, rgba(255, 0, 0, 0.4));
        }

        .btn-reset {
            background: var(--theme-hover-bg, rgba(0, 0, 0, 0.5));
            color: white;
            border: 1px solid var(--theme-border, rgba(255, 0, 0, 0.3));
        }

        .btn-reset:hover {
            background: var(--theme-btn-bg, rgba(255, 0, 0, 0.2));
            border-color: var(--theme-glow, rgba(255, 0, 0, 0.5));
        }
        
        .car-list {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            background: var(--theme-hover-bg, rgba(0, 0, 0, 0.5));
            border-radius: 5px;
            padding: 10px;
            border: 1px solid var(--theme-border-light, rgba(255, 0, 0, 0.2));
        }

        .car-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            margin-bottom: 5px;
            background: var(--theme-hover-bg, rgba(0, 0, 0, 0.4));
            border-radius: 4px;
            border: 1px solid var(--theme-border-light, rgba(255, 0, 0, 0.2));
            transition: all 0.3s ease;
        }

        .car-item:hover {
            background: var(--theme-hover-bg, rgba(255, 0, 0, 0.1));
            border-color: var(--theme-border, rgba(255, 0, 0, 0.3));
        }
        
        .car-actions {
            display: flex;
            gap: 5px;
        }
        
        .btn-small {
            padding: 3px 8px;
            font-size: 0.7rem;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #777;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
            color: #444;
        }
        
        footer {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-size: 0.9rem;
            flex-shrink: 0;
            padding: 10px 0;
        }

        /* 密码对话框样式 */
        .edit-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .edit-overlay.active {
            display: flex;
        }

        .edit-dialog {
            background: #1a1a1a;
            border: 1px solid var(--theme-border, rgba(255, 0, 0, 0.3));
            border-radius: 10px;
            padding: 30px;
            min-width: 360px;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .edit-dialog h3 {
            margin-bottom: 20px;
            color: var(--theme-primary, #ff0000);
        }

        .edit-dialog .form-group {
            margin-bottom: 12px;
        }

        .edit-dialog .time-inputs {
            display: flex;
            gap: 10px;
        }

        .edit-dialog .time-inputs > div {
            flex: 1;
        }

        .edit-dialog .button-group {
            margin-top: 20px;
            justify-content: flex-end;
        }

        .password-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .password-overlay.active {
            display: flex;
        }

        .password-dialog {
            background: #1a1a1a;
            border: 1px solid var(--theme-border, rgba(255, 0, 0, 0.3));
            border-radius: 10px;
            padding: 30px;
            min-width: 320px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .password-dialog h3 {
            margin-bottom: 15px;
            color: var(--theme-primary, #ff0000);
        }

        .password-dialog .button-group {
            margin-top: 15px;
            justify-content: flex-end;
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--theme-hover-bg, rgba(0, 0, 0, 0.5));
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--theme-scrollbar, rgba(255, 0, 0, 0.5));
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--theme-scrollbar-hover, rgba(255, 0, 0, 0.8));
        }
        .logo{
            width: 100%;
            display: block;
            text-align: center;
        }

        .logo-text {
            font-size: 3rem;
            margin: 0;
            background: linear-gradient(90deg, var(--theme-primary, #ff0000), var(--theme-secondary, #cc0000));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 0 0 30px var(--theme-glow, rgba(255, 0, 0, 0.5));
            font-weight: 900;
        }

        .logoimg{
            width: 30%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* 主题选择器样式 */
        .theme-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .theme-option {
            cursor: pointer;
            padding: 15px;
            border: 2px solid var(--theme-border-light, rgba(255, 255, 255, 0.2));
            border-radius: 8px;
            background: var(--theme-hover-bg, rgba(0, 0, 0, 0.3));
            transition: all 0.3s ease;
            text-align: center;
        }

        .theme-option:hover {
            border-color: var(--theme-border, rgba(255, 255, 255, 0.5));
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--theme-hover-bg, rgba(0, 0, 0, 0.3));
        }

        .theme-option.active {
            border-color: var(--theme-primary, #ff0000);
            box-shadow: 0 0 20px var(--theme-primary, rgba(255, 0, 0, 0.5));
        }

        .theme-preview {
            width: 100%;
            height: 60px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .theme-option span {
            display: block;
            color: #ddd;
            font-size: 0.9rem;
        }


        /* 动态主题变量 */
        :root {
            --theme-primary: #ff0000;
            --theme-secondary: #cc0000;
            --theme-bg: #1a0000;
            --theme-border: rgba(255, 0, 0, 0.3);
            --theme-border-light: rgba(255, 0, 0, 0.1);
            --theme-glow: rgba(255, 0, 0, 0.5);
            --theme-scrollbar: rgba(255, 0, 0, 0.5);
            --theme-scrollbar-hover: rgba(255, 0, 0, 0.8);
            --theme-header-bg: rgba(255, 0, 0, 0.2);
            --theme-hover-bg: rgba(255, 0, 0, 0.1);
            --theme-rank1-bg: rgba(255, 0, 0, 0.2);
            --theme-rank2-color: #cc0000;
            --theme-rank2-bg: rgba(204, 0, 0, 0.15);
            --theme-rank3-color: #990000;
            --theme-rank3-bg: rgba(153, 0, 0, 0.1);
            --theme-btn-bg: rgba(255, 0, 0, 0.2);
            --theme-btn-hover: rgba(255, 0, 0, 0.4);
            --theme-btn-color: #ff6666;
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1 class="logo-text">JAKE RACING</h1>
                <img src="" alt="Logo" class="logoimg" style="display: none;">
            </div>
            <!-- 赛道选择器 -->
            <div class="track-selector">
                <label for="trackSelect">当前赛道:</label>
                <select id="trackSelect" class="track-select">
                    <!-- 赛道选项将通过JavaScript动态生成 -->
                </select>
            </div>
        </header>
        
        <!-- 主排行榜 -->
        <div class="leaderboard">
            <div class="leaderboard-title-bar">
                <div class="leaderboard-title" id="leaderboardTitle">排行榜</div>
                <div class="leaderboard-tabs">
                    <button class="leaderboard-tab active" data-filter="all">总榜</button>
                    <button class="leaderboard-tab" data-filter="day">日榜</button>
                    <button class="leaderboard-tab" data-filter="week">周榜</button>
                    <button class="leaderboard-tab" data-filter="month">月榜</button>
                    <button class="leaderboard-tab" data-filter="year">年榜</button>
                </div>
            </div>
            <div class="leaderboard-header">
                <div>排名</div>
                <div>车手姓名</div>
                <div>圈速</div>
                <div>赛车型号</div>
                <div>日期</div>
            </div>
            <div class="leaderboard-list" id="leaderboardList">
                <!-- 排行榜内容将通过JavaScript动态生成 -->
            </div>
        </div>
        
        <!-- 管理区域 -->
        <div class="management-toggle">
            <button class="toggle-btn" id="toggleManagement">管理数据</button>
        </div>
        
        <div class="management-panel" id="managementPanel">
            <div class="panel-tabs">
                <button class="panel-tab active" data-tab="edit">编辑数据</button>
                <button class="panel-tab" data-tab="tracks">赛道管理</button>
                <button class="panel-tab" data-tab="cars">车型管理</button>
                <button class="panel-tab" data-tab="appearance">外观设置</button>
            </div>
            
            <!-- 编辑数据面板 -->
            <div class="panel-content active" id="editPanel">
                <h2>添加新记录</h2>
                <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; padding: 15px; background: var(--theme-hover-bg, rgba(0, 0, 0, 0.2)); border-radius: 8px;">
                    <input type="text" id="driverName" placeholder="车手姓名" style="width: 100px; margin: 0;">
                    <div style="display: flex; align-items: center; gap: 2px;">
                        <input type="number" id="minutes" min="0" max="59" placeholder="分" value="1" style="width: 55px; margin: 0; text-align: center;">
                        <span style="color: #888;">:</span>
                        <input type="number" id="seconds" min="0" max="59" placeholder="秒" value="33" style="width: 55px; margin: 0; text-align: center;">
                        <span style="color: #888;">:</span>
                        <input type="number" id="milliseconds" min="0" max="999" placeholder="毫秒" value="999" style="width: 65px; margin: 0; text-align: center;">
                    </div>
                    <select id="recordTrack" style="width: auto; margin: 0;"></select>
                    <select id="carModel" style="width: auto; margin: 0;"></select>
                    <input type="date" id="recordDate" style="width: auto; margin: 0;">
                    <button class="btn-add" id="addRecord" style="white-space: nowrap;">添加</button>
                    <button class="btn-reset" id="resetForm" style="white-space: nowrap;">重置</button>
                </div>

                <h2>现有记录</h2>

    <div class="password-overlay" id="passwordOverlay">
        <div class="password-dialog">
            <h3>请输入管理员密码</h3>

                <input type="password" id="passwordInput" placeholder="请输入密码">
            </div>
            <div class="button-group">
                <button class="btn-reset" id="passwordCancel">取消</button>
                <button class="btn-add" id="passwordConfirm">确认</button>
            </div>
        </div>
    </div>

    <script>
        /* ========== 存储前缀（按文件路径隔离数据） ========== */
        const STORAGE_PREFIX = location.pathname + '::';

        function sGet(key) { return localStorage.getItem(STORAGE_PREFIX + key); }
        function sSet(key, value) { localStorage.setItem(STORAGE_PREFIX + key, value); }
        function sRemove(key) { localStorage.removeItem(STORAGE_PREFIX + key); }

        /* ========== 数据初始化 ========== */
        let tracks = JSON.parse(sGet('tracks')) || [
            { id: 'shanghai', name: '上海国际赛车场' },
            { id: 'suzuka', name: '铃鹿赛道' },
            { id: 'spa', name: '斯帕赛道' }
        ];
        let currentTrackId = sGet('currentTrackId') || (tracks.length > 0 ? tracks[0].id : null);

        // 首次使用时保存默认赛道
        if (!sGet('tracks')) {
            sSet('tracks', JSON.stringify(tracks));
        }
        if (!sGet('currentTrackId') && currentTrackId) {
            sSet('currentTrackId', currentTrackId);
        }

        // 为了兼容旧数据，如果存在旧的lapRecords，将其迁移到第一个赛道
        const oldRecords = JSON.parse(sGet('lapRecords'));
        if (oldRecords && oldRecords.length > 0 && currentTrackId) {
            const trackRecordsKey = `lapRecords_${currentTrackId}`;
            if (!sGet(trackRecordsKey)) {
                sSet(trackRecordsKey, JSON.stringify(oldRecords));
            }
            sRemove('lapRecords');
        }

        let records = [];
        let currentTimeFilter = 'all';
        let carModels = JSON.parse(sGet('carModels')) || [
            "法拉利 SF90", "梅赛德斯 W12", "红牛 RB16B",
            "迈凯伦 MCL35M", "阿尔派 A521", "阿斯顿马丁 AMR21"
        ];

        /* ========== DOM 元素缓存 ========== */
        const container = document.querySelector('.container');
        const leaderboardList = document.getElementById('leaderboardList');
        const editList = document.getElementById('editList');
        const carList = document.getElementById('carList');
        const trackList = document.getElementById('trackList');
        const trackSelect = document.getElementById('trackSelect');
        const recordTrackSelect = document.getElementById('recordTrack');
        const carModelSelect = document.getElementById('carModel');
        const driverNameInput = document.getElementById('driverName');
        const minutesInput = document.getElementById('minutes');
        const secondsInput = document.getElementById('seconds');
        const millisecondsInput = document.getElementById('milliseconds');
        const addRecordBtn = document.getElementById('addRecord');
        const resetFormBtn = document.getElementById('resetForm');
        const newCarModelInput = document.getElementById('newCarModel');
        const addCarModelBtn = document.getElementById('addCarModel');
        const newTrackNameInput = document.getElementById('newTrackName');
        const addTrackBtn = document.getElementById('addTrack');
        const toggleManagementBtn = document.getElementById('toggleManagement');
        const managementPanel = document.getElementById('managementPanel');
        const panelTabs = document.querySelectorAll('.panel-tab');
        const panelContents = document.querySelectorAll('.panel-content');
        const widthModeRadios = document.querySelectorAll('input[name="widthMode"]');
        const customWidthInput = document.getElementById('customWidth');

        /* ========== 页面初始化 ========== */
        document.addEventListener('DOMContentLoaded', function() {
            loadCurrentTrackRecords();
            renderTracks();
            renderLeaderboard();
            renderEditList();
            renderCarModels();
            updateFilterOptions();
            loadWidthSettings();
            loadThemeSettings();
            loadLeaderboardTitle();
            setupEventListeners();
            // 初始化日期输入为今天
            const recordDateInput = document.getElementById('recordDate');
            if (recordDateInput) recordDateInput.value = getTodayStr();
        });

        /* ========== 事件监听器 ========== */
        function setupEventListeners() {
            // 管理面板切换
            toggleManagementBtn.addEventListener('click', function() {
                // 检查是否设置了管理员密码
                const savedPassword = sGet('adminPassword');

                // 如果面板已打开，直接关闭
                if (managementPanel.classList.contains('active')) {
                    managementPanel.classList.remove('active');
                    this.textContent = '管理数据';
                    return;
                }

                // 如果设置了密码，需要验证
                if (savedPassword) {
                    showPasswordDialog(function(inputPassword) {
                        if (inputPassword !== savedPassword) {
                            alert('密码错误！');
                            return;
                        }
                        // 验证通过，打开面板
                        managementPanel.classList.add('active');
                        toggleManagementBtn.textContent = '隐藏管理';
                    });
                    return;
                }

                // 无密码保护，直接打开面板
                managementPanel.classList.add('active');
                this.textContent = '隐藏管理';
            });
            
            // 面板标签切换
            panelTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const tabId = this.getAttribute('data-tab');
                    
                    // 更新标签状态
                    panelTabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 更新内容显示
                    panelContents.forEach(content => content.classList.remove('active'));
                    document.getElementById(`${tabId}Panel`).classList.add('active');
                });
            });

            // 添加记录按钮事件
            addRecordBtn.addEventListener('click', function() {
                const driverName = driverNameInput.value.trim();
                const carModel = carModelSelect.value;
                const selectedTrackId = recordTrackSelect.value;

                if (!driverName) { alert('请输入车手姓名'); return; }

                const lapTime = validateLapTime(
                    parseInt(minutesInput.value),
                    parseInt(secondsInput.value),
                    parseInt(millisecondsInput.value)
                );
                if (!lapTime) { alert('请输入有效的时间值'); return; }

                // 获取日期（未选择则用今天）
                const dateInput = document.getElementById('recordDate');
                const recordDate = dateInput.value
                    ? new Date(dateInput.value + 'T00:00:00').toISOString()
                    : new Date().toISOString();

                const newRecord = {
                    driverName,
                    formattedTime: lapTime.formattedTime,
                    totalMilliseconds: lapTime.totalMilliseconds,
                    carModel,
                    date: recordDate
                };

                // 添加到选定赛道的记录中
                const trackRecordsKey = `lapRecords_${selectedTrackId}`;
                let trackRecords = JSON.parse(sGet(trackRecordsKey)) || [];
                trackRecords.push(newRecord);
                sSet(trackRecordsKey, JSON.stringify(trackRecords));

                // 如果添加的是当前赛道的记录，重新加载并刷新排行榜
                if (selectedTrackId === currentTrackId) {
                    loadCurrentTrackRecords();
                    renderLeaderboard();
                }

                // 刷新编辑列表和筛选器
                renderEditList();
                updateFilterOptions();
                resetForm();

                alert(`记录已添加到 ${tracks.find(t => t.id === selectedTrackId)?.name || '选定赛道'}！`);
            });

            // 重置表单按钮事件
            resetFormBtn.addEventListener('click', function() {
                resetForm();
            });

            // 添加车型按钮事件
            addCarModelBtn.addEventListener('click', function() {
                const newCar = newCarModelInput.value.trim();
                if (!newCar) {
                    alert('请输入车型名称');
                    return;
                }

                if (carModels.includes(newCar)) {
                    alert('该车型已存在');
                    return;
                }

                carModels.push(newCar);
                saveCarModels();
                renderCarModels();
                newCarModelInput.value = '';
            });

            // 添加赛道按钮事件
            addTrackBtn.addEventListener('click', function() {
                const newTrackName = newTrackNameInput.value.trim();
                if (!newTrackName) {
                    alert('请输入赛道名称');
                    return;
                }

                const trackId = 'track_' + Date.now();
                const newTrack = { id: trackId, name: newTrackName };

                if (tracks.some(t => t.name === newTrackName)) {
                    alert('该赛道已存在');
                    return;
                }

                tracks.push(newTrack);
                saveTracks();

                // 如果这是第一个赛道，设置为当前赛道
                if (tracks.length === 1) {
                    currentTrackId = trackId;
                    sSet('currentTrackId', currentTrackId);
                    loadCurrentTrackRecords();
                    renderLeaderboard();
                    renderEditList();
                    updateFilterOptions();
                }

                renderTracks();
                newTrackNameInput.value = '';
            });

            // 赛道选择器事件
            trackSelect.addEventListener('change', function() {
                currentTrackId = this.value;
                sSet('currentTrackId', currentTrackId);
                loadCurrentTrackRecords();
                renderLeaderboard();
                renderEditList();
                updateFilterOptions();
            });

            // 宽度模式切换事件
            widthModeRadios.forEach(radio => {
                radio.addEventListener('change', function() {
                    if (this.value === 'fullscreen') {
                        customWidthInput.disabled = true;
                        container.classList.remove('custom-width');
                        sSet('widthMode', 'fullscreen');
                    } else {
                        customWidthInput.disabled = false;
                        applyCustomWidth();
                        sSet('widthMode', 'custom');
                    }
                });
            });

            // 自定义宽度输入事件
            customWidthInput.addEventListener('input', function() {
                if (document.querySelector('input[name="widthMode"]:checked').value === 'custom') {
                    applyCustomWidth();
                }
            });

            customWidthInput.addEventListener('change', function() {
                sSet('customWidth', this.value);
            });

            // Logo更新按钮
            const updateLogoBtn = document.getElementById('updateLogo');
            const logoUrlInput = document.getElementById('logoUrl');
            const logoTextInput = document.getElementById('logoText');
            updateLogoBtn.addEventListener('click', function() {
                const url = logoUrlInput.value.trim();
                const text = logoTextInput.value.trim();
                updateLogo(url, text);
                alert('Logo已更新！');
            });

            // 清除Logo按钮
            const clearLogoBtn = document.getElementById('clearLogo');
            clearLogoBtn.addEventListener('click', function() {
                logoUrlInput.value = '';
                logoTextInput.value = '';
                updateLogo('', '');
                alert('已恢复默认Logo');
            });

            // 主题选择器
            const themeOptions = document.querySelectorAll('.theme-option');
            themeOptions.forEach(option => {
                option.addEventListener('click', function() {
                    const theme = this.getAttribute('data-theme');
                    applyTheme(theme);
                    themeOptions.forEach(opt => opt.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // 恢复默认主题
            const resetThemeBtn = document.getElementById('resetTheme');
            resetThemeBtn.addEventListener('click', function() {
                applyTheme('red');
                themeOptions.forEach(opt => opt.classList.remove('active'));
                themeOptions[0].classList.add('active');
                alert('已恢复默认主题');
            });

            // 设置管理员密码
            const setAdminPasswordBtn = document.getElementById('setAdminPassword');
            const removeAdminPasswordBtn = document.getElementById('removeAdminPassword');
            const adminPasswordInput = document.getElementById('adminPassword');
            const passwordStatusSpan = document.getElementById('passwordStatus');

            // 更新密码状态显示
            function updatePasswordStatus() {
                const hasPassword = sGet('adminPassword');
                if (passwordStatusSpan) {
                    passwordStatusSpan.textContent = hasPassword ? '已设置' : '未设置';
                }
            }

            setAdminPasswordBtn.addEventListener('click', function() {
                const password = adminPasswordInput.value.trim();

                if (password === '') {
                    alert('请输入密码！如需移除密码保护，请点击"移除密码"按钮');
                    return;
                }

                // 设置密码 - 弹出密码对话框确认
                showPasswordDialog(function(confirmPassword) {
                    if (confirmPassword === password) {
                        sSet('adminPassword', password);
                        adminPasswordInput.value = '';
                        updatePasswordStatus();
                        alert('管理员密码已设置！');
                    } else {
                        alert('两次输入的密码不一致，请重试');
                    }
                });
            });

            // 移除密码按钮
            removeAdminPasswordBtn.addEventListener('click', function() {
                const hasPassword = sGet('adminPassword');
                if (!hasPassword) {
                    alert('当前未设置密码保护');
                    return;
                }

                if (confirm('确定要移除管理员密码保护吗？')) {
                    sRemove('adminPassword');
                    adminPasswordInput.value = '';
                    updatePasswordStatus();
                    alert('已移除密码保护');
                }
            });

            // 页面加载时更新密码状态
            updatePasswordStatus();

            // 筛选器事件监听
            const filterTrackSelect = document.getElementById('filterTrack');
            const filterCarSelect = document.getElementById('filterCar');
            const clearFiltersBtn = document.getElementById('clearFilters');

            if (filterTrackSelect) {
                filterTrackSelect.addEventListener('change', function() {
                    renderEditList();
                });
            }

            if (filterCarSelect) {
                filterCarSelect.addEventListener('change', function() {
                    renderEditList();
                });
            }

            if (clearFiltersBtn) {
                clearFiltersBtn.addEventListener('click', function() {
                    filterTrackSelect.value = '';
                    filterCarSelect.value = '';
                    renderEditList();
                });
            }

            const exportCurrentBtn = document.getElementById('exportCurrentTrack');
            if (exportCurrentBtn) {
                exportCurrentBtn.addEventListener('click', function() {
                    const trackName = tracks.find(t => t.id === currentTrackId)?.name || '当前赛道';
                    const sorted = [...records].sort((a, b) => a.totalMilliseconds - b.totalMilliseconds);
                    exportToCSV(sorted.map(r => ({ ...r, trackName })), `${trackName}_圈速排行榜`);
                });
            }

            const exportAllBtn = document.getElementById('exportAllTracks');
            if (exportAllBtn) {
                exportAllBtn.addEventListener('click', function() {
                    const allRecords = loadAllTrackRecords();
                    allRecords.sort((a, b) => a.totalMilliseconds - b.totalMilliseconds);
                    exportToCSV(allRecords, '全部赛道_圈速排行榜');
                });
            }

            // 时间筛选标签
            const leaderboardTabs = document.querySelectorAll('.leaderboard-tab');
            leaderboardTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    currentTimeFilter = this.getAttribute('data-filter');
                    leaderboardTabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');

        // 弹出密码输入对话框，通过回调返回用户输入
        function showPasswordDialog(callback) {
            const overlay = document.getElementById('passwordOverlay');
            const input = document.getElementById('passwordInput');
            const confirmBtn = document.getElementById('passwordConfirm');
            const cancelBtn = document.getElementById('passwordCancel');

            input.value = '';
            overlay.classList.add('active');
            input.focus();

            function cleanup() {
                overlay.classList.remove('active');
                confirmBtn.removeEventListener('click', onConfirm);
                cancelBtn.removeEventListener('click', onCancel);
                input.removeEventListener('keydown', onKeydown);
            }

            function onConfirm() {
                const value = input.value;
                cleanup();
                callback(value);
            }

            function onCancel() {
                cleanup();
            }

            function onKeydown(e) {
                if (e.key === 'Enter') onConfirm();
                if (e.key === 'Escape') onCancel();
            }

            confirmBtn.addEventListener('click', onConfirm);
            cancelBtn.addEventListener('click', onCancel);
            input.addEventListener('keydown', onKeydown);
        }

        // 批量设置 CSS 变量
        function setThemeVars(vars) {
            const root = document.documentElement;
            for (const [key, value] of Object.entries(vars)) {
                const cssVar = themeVarMap[key];
                if (cssVar) root.style.setProperty(cssVar, value);
            }
        }

        // 将预设主题的颜色变量应用到 :root
        function applyTheme(themeName) {
            const theme = themes[themeName];

            setThemeVars(theme);

        // 删除赛道及其所有记录
        function deleteTrack(index) {
            if (tracks.length <= 1) {
                alert('至少需要保留一个赛道');
                return;
            }

            const track = tracks[index];
            if (confirm(`确定要删除赛道"${track.name}"吗？该赛道的所有记录也将被删除！`)) {
                // 删除该赛道的所有记录
                const trackRecordsKey = `lapRecords_${track.id}`;
                sRemove(trackRecordsKey);

                // 从赛道列表中删除
                tracks.splice(index, 1);

                // 如果删除的是当前赛道，切换到第一个赛道
                if (track.id === currentTrackId) {
                    currentTrackId = tracks[0].id;
                    sSet('currentTrackId', currentTrackId);
                    loadCurrentTrackRecords();
                    renderLeaderboard();
                    renderEditList();
                    updateFilterOptions();
                }

                saveTracks();
                renderTracks();
            }
        }

        // 删除车型
        function deleteCarModel(index) {
            if (confirm('确定要删除这个车型吗？使用此车型的记录将不会被删除，但可能无法正确显示。')) {
                carModels.splice(index, 1);
                saveCarModels();
                renderCarModels();
            }
        }

        // 根据赛道ID删除特定记录（用于管理面板）
        function deleteRecordByTrack(trackId, driverName, formattedTime, carModel) {
            if (confirm('确定要删除这条记录吗？')) {
                const trackRecordsKey = `lapRecords_${trackId}`;
                let trackRecords = JSON.parse(sGet(trackRecordsKey)) || [];

                // 找到并删除匹配的记录
                trackRecords = trackRecords.filter(record => {
                    return !(record.driverName === driverName &&
                             record.formattedTime === formattedTime &&
                             record.carModel === carModel);
                });

                sSet(trackRecordsKey, JSON.stringify(trackRecords));

                // 如果删除的是当前赛道的记录，重新加载当前赛道记录
                if (trackId === currentTrackId) {
                    loadCurrentTrackRecords();
                    renderLeaderboard();
                }

                renderEditList();
                updateFilterOptions();
            }
        }

        // 根据赛道ID编辑特定记录（用于管理面板）
        function editRecordByTrack(trackId, recordIndex) {
            const trackRecordsKey = `lapRecords_${trackId}`;
            const trackRecords = JSON.parse(sGet(trackRecordsKey)) || [];
            const record = trackRecords[recordIndex];

            if (!record) {
                alert('记录不存在');
                return;
            }

            const timeMatch = record.formattedTime.match(/(\d+):(\d+):(\d+)/);
            const trackName = tracks.find(t => t.id === trackId)?.name || trackId;
            const dateValue = record.date ? formatDate(record.date) : getTodayStr();

            const overlay = document.getElementById('editOverlay');
            document.getElementById('editDialogTitle').textContent = '编辑记录 - ' + trackName;
            document.getElementById('editDialogName').value = record.driverName;
            document.getElementById('editDialogMin').value = timeMatch[1];
            document.getElementById('editDialogSec').value = timeMatch[2];
            document.getElementById('editDialogMs').value = timeMatch[3];
            document.getElementById('editDialogDate').value = dateValue;

            const carSelect = document.getElementById('editDialogCar');
            carSelect.innerHTML = carModels.map(car =>
                `<option value="${car}" ${car === record.carModel ? 'selected' : ''}>${car}</option>`
            ).join('');

            overlay.classList.add('active');

            const saveBtn = document.getElementById('editDialogSave');
            const cancelBtn = document.getElementById('editDialogCancel');

            function cleanup() {
                overlay.classList.remove('active');
                saveBtn.removeEventListener('click', onSave);
                cancelBtn.removeEventListener('click', onCancel);
            }

            function onSave() {
                const driverName = document.getElementById('editDialogName').value.trim();
                const carModel = document.getElementById('editDialogCar').value;
                const editDate = document.getElementById('editDialogDate').value;

                if (!driverName) { alert('请输入车手姓名'); return; }

                const lapTime = validateLapTime(
                    parseInt(document.getElementById('editDialogMin').value),
                    parseInt(document.getElementById('editDialogSec').value),
                    parseInt(document.getElementById('editDialogMs').value)
                );
                if (!lapTime) { alert('请输入有效的时间值'); return; }

                const { formattedTime, totalMilliseconds } = lapTime;
                const date = editDate
                    ? new Date(editDate + 'T00:00:00').toISOString()
                    : (record.date || new Date().toISOString());

                trackRecords[recordIndex] = { driverName, formattedTime, totalMilliseconds, carModel, date };
                sSet(trackRecordsKey, JSON.stringify(trackRecords));

                if (trackId === currentTrackId) {
                    loadCurrentTrackRecords();
                    renderLeaderboard();
                }
                renderEditList();
                updateFilterOptions();
                cleanup();
            }

            function onCancel() {
                cleanup();
            }

            saveBtn.addEventListener('click', onSave);
            cancelBtn.addEventListener('click', onCancel);
        }

        /* ========== 导出功能 ========== */

        function exportToCSV(data, filename) {
            if (!data || data.length === 0) {
                alert('没有可导出的数据');
                return;
            }
            const headers = ['排名', '车手姓名', '圈速', '总毫秒数', '赛道', '车型', '日期'];
            const rows = data.map((r, i) => [
                i + 1,
                r.driverName,
                r.formattedTime,
                r.totalMilliseconds,
                r.trackName || '',
                r.carModel || '',
                r.date ? new Date(r.date).toLocaleDateString('zh-CN') : ''
            ]);
            const csvContent = [headers, ...rows]
                .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
                .join('\r\n');
            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${filename}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        /* ========== 工具函数 ========== */

        // 转义 HTML 属性中的特殊字符，防止 XSS 和引号破坏
        function escapeAttr(str) {
            return String(str).replace(/&/g, '&amp;').replace(/'/g, '&#39;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // 验证圈速输入，返回 null 表示无效
        function validateLapTime(minutes, seconds, milliseconds) {
            if (isNaN(minutes) || isNaN(seconds) || isNaN(milliseconds) ||
                minutes < 0 || seconds < 0 || milliseconds < 0 ||
                seconds > 59 || milliseconds > 999) {
                return null;
            }
            const formattedTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}:${milliseconds.toString().padStart(3, '0')}`;
            const totalMilliseconds = minutes * 60000 + seconds * 1000 + milliseconds;
            return { formattedTime, totalMilliseconds };
        }

        // 获取今天的日期字符串 (YYYY-MM-DD)
        function getTodayStr() {
            return new Date().toISOString().slice(0, 10);
        }

        // 格式化日期显示
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // 获取时间筛选的起始日期
        function getFilterStartDate(filter) {
            const now = new Date();
            switch (filter) {
                case 'day': {
                    const today = new Date(now);
                    today.setHours(0, 0, 0, 0);
                    return today;
                }
                case 'week': {
                    const day = now.getDay();
                    const diff = day === 0 ? 6 : day - 1; // 周一为起点
                    const monday = new Date(now);
                    monday.setDate(now.getDate() - diff);
                    monday.setHours(0, 0, 0, 0);
                    return monday;
                }
                case 'month': {
                    return new Date(now.getFullYear(), now.getMonth(), 1);
                }
                case 'year': {
                    return new Date(now.getFullYear(), 0, 1);
                }
                default:
                    return null;
            }
        }

        // 根据时间筛选过滤记录
        function filterRecordsByTime(recordsList) {
            if (currentTimeFilter === 'all') return recordsList;
            const startDate = getFilterStartDate(currentTimeFilter);
            if (!startDate) return recordsList;
            return recordsList.filter(record => {
                if (!record.date) return true; // 旧记录无日期，始终显示
                return new Date(record.date) >= startDate;
            });
        }

        // 更新排行榜标题
        function updateLeaderboardTitle() {
            const titleEl = document.getElementById('leaderboardTitle');
            const customTitle = sGet('leaderboardTitle');

            if (customTitle) {
                titleEl.textContent = customTitle;
                return;
            }

            // 默认标题：赛道名 + 筛选维度
            const currentTrack = tracks.find(t => t.id === currentTrackId);
            const trackName = currentTrack ? currentTrack.name : '排行榜';
            const filterNames = { all: '总榜', day: '日榜', week: '周榜', month: '月榜', year: '年榜' };
            const filterName = filterNames[currentTimeFilter] || '总榜';
            titleEl.textContent = `${trackName} · ${filterName}`;
        }

        // 加载排行榜标题设置
        function loadLeaderboardTitle() {
            const savedTitle = sGet('leaderboardTitle');
            if (savedTitle) {
                const customTitleInput = document.getElementById('customTitle');
                if (customTitleInput) customTitleInput.value = savedTitle;
            }
            updateLeaderboardTitle();
        }

        /* ========== 页面渲染 ========== */

        // 渲染主排行榜（支持时间筛选）
        function renderLeaderboard() {
            // 按时间排序（时间越短排名越高）
            records.sort((a, b) => a.totalMilliseconds - b.totalMilliseconds);

            // 根据时间筛选
            const filtered = filterRecordsByTime(records);

            updateLeaderboardTitle();

            if (filtered.length === 0) {
                const filterNames = { all: '', day: '今日', week: '本周', month: '本月', year: '今年' };
                const hint = filterNames[currentTimeFilter];
                leaderboardList.innerHTML = `
                    <div class="empty-state">
                        <i>🏎️</i>
                        <p>暂无${hint}圈速记录</p>
                        <p>${currentTimeFilter === 'all' ? '点击下方"管理数据"添加记录' : '试试切换到其他时间范围'}</p>
                    </div>
                `;
                return;
            }

            let leaderboardHTML = '';

            filtered.forEach((record, index) => {
                const rankClass = index === 0 ? 'rank-1' :
                                 index === 1 ? 'rank-2' :
                                 index === 2 ? 'rank-3' : '';

                leaderboardHTML += `
                    <div class="leaderboard-item ${rankClass}">
                        <div class="rank">#${index + 1}</div>
                        <div class="driver-name">${record.driverName}</div>
                        <div class="lap-time"${index === 0 ? ' style="color: #aa44ff;"' : ''}>${record.formattedTime}</div>
                        <div class="car-model">${record.carModel}</div>
                        <div class="car-model">${formatDate(record.date)}</div>
                    </div>
                `;
            });

            leaderboardList.innerHTML = leaderboardHTML;
        }

        // 渲染编辑列表
        function renderEditList() {
            let editListHTML = '';

            // 获取所有赛道的记录
            const allRecords = loadAllTrackRecords();

            // 获取筛选条件
            const filterTrackValue = document.getElementById('filterTrack')?.value || '';
            const filterCarValue = document.getElementById('filterCar')?.value || '';

            // 根据筛选条件过滤记录
            const filteredRecords = allRecords.filter(record => {
                const trackMatch = !filterTrackValue || record.trackId === filterTrackValue;
                const carMatch = !filterCarValue || record.carModel === filterCarValue;
                return trackMatch && carMatch;
            });

            if (allRecords.length === 0) {
                editListHTML = `
                    <div class="empty-state">
                        <i>🏎️</i>
                        <p>暂无圈速记录</p>
                        <p>请在上方表单中添加记录</p>
                    </div>
                `;
            } else if (filteredRecords.length === 0) {
                editListHTML = `
                    <div class="empty-state">
                        <i>🔍</i>
                        <p>没有符合筛选条件的记录</p>
                        <p>请尝试调整筛选条件</p>
                    </div>
                `;
            } else {
                filteredRecords.forEach((record, displayIndex) => {
                    // 找到该记录在对应赛道记录数组中的索引
                    const trackRecordsKey = `lapRecords_${record.trackId}`;
                    const trackRecords = JSON.parse(sGet(trackRecordsKey)) || [];
                    const recordIndex = trackRecords.findIndex(r =>
                        r.driverName === record.driverName &&
                        r.formattedTime === record.formattedTime &&
                        r.carModel === record.carModel
                    );

                    editListHTML += `
                        <div class="car-item">
                            <span>
                                <strong>${record.driverName}</strong> -
                                ${record.formattedTime} -
                                ${record.carModel} -
                                <em style="color: var(--theme-secondary, #cc0000);">${record.trackName}</em> -
                                ${formatDate(record.date)}
                            </span>
                            <div class="car-actions">
                                <button class="btn-edit btn-small" onclick="editRecordByTrack('${record.trackId}', ${recordIndex})">编辑</button>
                                <button class="btn-delete btn-small" onclick="deleteRecordByTrack('${escapeAttr(record.trackId)}', '${escapeAttr(record.driverName)}', '${escapeAttr(record.formattedTime)}', '${escapeAttr(record.carModel)}')">删除</button>
                            </div>
                        </div>
                    `;
                });
            }

            editList.innerHTML = editListHTML;
        }

        // 渲染赛道选择器和列表
        function renderTracks() {
            // 更新赛道选择下拉框（用于切换显示的赛道）
            trackSelect.innerHTML = tracks.map(track =>
                `<option value="${track.id}" ${track.id === currentTrackId ? 'selected' : ''}>${track.name}</option>`
            ).join('');

            // 更新添加记录表单中的赛道选择器
            if (recordTrackSelect) {
                recordTrackSelect.innerHTML = tracks.map(track =>
                    `<option value="${track.id}" ${track.id === currentTrackId ? 'selected' : ''}>${track.name}</option>`
                ).join('');
            }

            // 渲染赛道管理列表
            let trackListHTML = '';

            if (tracks.length === 0) {
                trackListHTML = '<div class="empty-state">暂无赛道，请添加</div>';
            } else {
                tracks.forEach((track, index) => {
                    const isCurrentTrack = track.id === currentTrackId;
                    trackListHTML += `
                        <div class="car-item">
                            <span>${track.name}${isCurrentTrack ? ' (当前)' : ''}</span>
                            <div class="car-actions">
                                <button class="btn-delete btn-small" onclick="deleteTrack(${index})" ${tracks.length <= 1 ? 'disabled' : ''}>删除</button>
                            </div>
                        </div>
                    `;
                });
            }

            trackList.innerHTML = trackListHTML;
        }

        // 渲染车型列表
        function renderCarModels() {
            // 更新车型选择下拉框
            carModelSelect.innerHTML = carModels.map(car =>
                `<option value="${car}">${car}</option>`
            ).join('');

            // 渲染车型管理列表
            let carListHTML = '';

            if (carModels.length === 0) {
                carListHTML = '<div class="empty-state">暂无车型，请添加</div>';
            } else {
                carModels.forEach((car, index) => {
                    carListHTML += `
                        <div class="car-item">
                            <span>${car}</span>
                            <div class="car-actions">
                                <button class="btn-delete btn-small" onclick="deleteCarModel(${index})">删除</button>
                            </div>
                        </div>
                    `;
                });
            }

            carList.innerHTML = carListHTML;

            // 同时更新筛选器中的车型选项
            updateFilterOptions();
        }

        // 更新筛选器选项
        function updateFilterOptions() {
            const filterTrackSelect = document.getElementById('filterTrack');
            const filterCarSelect = document.getElementById('filterCar');

            if (!filterTrackSelect || !filterCarSelect) return;

            // 保存当前选择的值
            const currentTrackFilter = filterTrackSelect.value;
            const currentCarFilter = filterCarSelect.value;

            // 更新赛道筛选器
            filterTrackSelect.innerHTML = '<option value="">全部赛道</option>' +
                tracks.map(track =>
                    `<option value="${track.id}" ${track.id === currentTrackFilter ? 'selected' : ''}>${track.name}</option>`
                ).join('');

            // 更新车型筛选器
            filterCarSelect.innerHTML = '<option value="">全部车型</option>' +
                carModels.map(car =>
                    `<option value="${car}" ${car === currentCarFilter ? 'selected' : ''}>${car}</option>`
                ).join('');
        }

        // 将 onclick 使用的函数暴露到全局作用域
        window.deleteTrack = deleteTrack;
        window.deleteCarModel = deleteCarModel;
        window.editRecordByTrack = editRecordByTrack;
        window.deleteRecordByTrack = deleteRecordByTrack;
    </script>
</body>
</html>
